name: Publish

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  PNPM_VERSION: '10'
  NODE_VERSION: '22'

jobs:
  # ── PREPARE ─────────────────────────────────────────────────────────────────
  Prepare:
    name: Install Dependencies
    concurrency:
      group: prepare-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Setup pnpm, node, and install
        uses: Anupheaus/agents/ci-templates/actions/pnpm-setup@v1
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          node-auth-token: ${{ secrets.GITHUB_TOKEN }}
          install-args: '--no-frozen-lockfile'

  # ── VALIDATE (parallel) ─────────────────────────────────────────────────────
  Validate-TypeCheck:
    name: Type check
    concurrency:
      group: validate-typecheck-${{ github.ref }}
      cancel-in-progress: true
    needs: Prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Setup pnpm, node, and install
        uses: Anupheaus/agents/ci-templates/actions/pnpm-setup@v1
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          node-auth-token: ${{ secrets.GITHUB_TOKEN }}
          install-args: '--no-frozen-lockfile'
      - name: Type check
        run: pnpm run typecheck

  Validate-Lint:
    name: Lint
    concurrency:
      group: validate-lint-${{ github.ref }}
      cancel-in-progress: true
    needs: Prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Setup pnpm, node, and install
        uses: Anupheaus/agents/ci-templates/actions/pnpm-setup@v1
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          node-auth-token: ${{ secrets.GITHUB_TOKEN }}
          install-args: '--no-frozen-lockfile'
      - name: Lint
        run: pnpm run lint

  Validate-Audit:
    name: Security audit
    concurrency:
      group: validate-audit-${{ github.ref }}
      cancel-in-progress: true
    needs: Prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Setup pnpm, node, and install
        uses: Anupheaus/agents/ci-templates/actions/pnpm-setup@v1
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          node-auth-token: ${{ secrets.GITHUB_TOKEN }}
          install-args: '--no-frozen-lockfile'
      - name: Security audit
        run: pnpm audit --audit-level=high

  # A committed credential must not merge green. TruffleHog scans only the commits the
  # pull request (or push) adds, and --only-verified fails the job only for a credential it
  # has confirmed is live, so a placeholder or a test fixture does not block the pipeline.
  Validate-Secrets:
    name: Secret detection
    concurrency:
      group: validate-secrets-${{ github.ref }}
      cancel-in-progress: true
    needs: Prepare
    runs-on: ubuntu-latest
    # Own guard, as the Test-Storybook job has (sc-477): the scanner itself is seconds and
    # the install dominates, but a stuck job must not run to GitHub's 6-hour default.
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      # fetch-depth 0 for the same reason Publish passes it: pnpm-setup defaults to a shallow
      # checkout (fetch-depth 1), and TruffleHog's base..HEAD range needs the base commit in
      # the clone — on a pull request GitHub checks out the merge ref at depth 1, and on a push
      # only HEAD, so a shallow clone makes the range resolve to nothing and the scan vacuous.
      - name: Setup pnpm, node, and install
        uses: Anupheaus/agents/ci-templates/actions/pnpm-setup@v1
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          node-auth-token: ${{ secrets.GITHUB_TOKEN }}
          install-args: '--no-frozen-lockfile'
          fetch-depth: '0'
      - name: Secret detection (TruffleHog)
        uses: trufflesecurity/trufflehog@main
        with:
          base: ${{ github.event.before || github.event.pull_request.base.sha }}
          head: HEAD
          extra_args: --only-verified

  # A dependency below the audit threshold (pnpm audit --audit-level=critical) still has to
  # fail here: this scans the installed tree on the filesystem, HIGH and CRITICAL, and
  # ignore-unfixed keeps an advisory with no fix from blocking the pull request.
  Validate-Trivy:
    name: Filesystem security scan
    concurrency:
      group: validate-trivy-${{ github.ref }}
      cancel-in-progress: true
    needs: Prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - name: Setup pnpm, node, and install
        uses: Anupheaus/agents/ci-templates/actions/pnpm-setup@v1
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          node-auth-token: ${{ secrets.GITHUB_TOKEN }}
          install-args: '--no-frozen-lockfile'
      - name: Filesystem security scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true

  # ── TEST (parallel) ─────────────────────────────────────────────────────────
  Test-Vitest:
    name: Vitest Tests
    concurrency:
      group: test-vitest-${{ github.ref }}
      cancel-in-progress: true
    needs: Prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      statuses: write
    steps:
      - name: Setup pnpm, node, and install
        uses: Anupheaus/agents/ci-templates/actions/pnpm-setup@v1
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          node-auth-token: ${{ secrets.GITHUB_TOKEN }}
          install-args: '--no-frozen-lockfile'

      - name: Run Vitest tests
        run: pnpm run test:ci

      - name: Publish coverage status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PCT="$(node -e "const fs=require('fs');const files=['coverage/coverage-summary.json','coverage/vitest/coverage-summary.json'];const file=files.find(p=>fs.existsSync(p));if(!file)process.exit(1);const pct=Math.round(JSON.parse(fs.readFileSync(file,'utf8')).total.lines.pct);if(!Number.isFinite(pct)||pct<0||pct>100)process.exit(1);process.stdout.write(String(pct));")" || exit 0
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" -f state=success -f context=coverage -f description="${PCT}%"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/vitest/lcov.info
          fail_ci_if_error: false

  Test-Storybook:
    name: Storybook Tests
    concurrency:
      group: test-storybook-${{ github.ref }}
      cancel-in-progress: true
    needs: Prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
    permissions:
      contents: read
      packages: read
    steps:
      - name: Setup pnpm, node, and install
        uses: Anupheaus/agents/ci-templates/actions/pnpm-setup@v1
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          node-auth-token: ${{ secrets.GITHUB_TOKEN }}
          install-args: '--no-frozen-lockfile'

      - name: Run Storybook tests
        env:
          STORYBOOK_COVERAGE: 1
        run: pnpm run storybook:build --quiet && npx concurrently -k -s first -n "SB,TEST" -c "magenta,blue" "npx http-server storybook-static --port 6006 --silent" "npx wait-on tcp:127.0.0.1:6006 && test-storybook --ci --coverage --index-json"

      - name: Upload Storybook coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/storybook/lcov.info
          fail_ci_if_error: false

  # ── PUBLISH — master only, after Validate and Test ──────────────────────────
  Publish:
    name: Build and Publish
    concurrency:
      group: publish-${{ github.ref }}
      cancel-in-progress: false
    needs: [Validate-TypeCheck, Validate-Lint, Validate-Audit, Test-Vitest, Test-Storybook]
    if: github.ref == 'refs/heads/master' && github.repository_owner == 'Anupheaus'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Setup pnpm, node, and install
        uses: Anupheaus/agents/ci-templates/actions/pnpm-setup@v1
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          node-auth-token: ${{ secrets.GITHUB_TOKEN }}
          install-args: '--no-frozen-lockfile'
          fetch-depth: '0'

      - name: Build
        run: pnpm run build

      - name: Bump version
        uses: phips28/gh-action-bump-version@master
        with:
          version-type: patch
          commit-message: 'CI: bumps version to {{version}} [skip ci]'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Pack
        run: pnpm pack

      - name: Publish
        run: pnpm publish $(ls *.tgz) --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
