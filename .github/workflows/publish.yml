name: Publish

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  PNPM_VERSION: '10'
  NODE_VERSION: '22'

jobs:
  # ── PREPARE ─────────────────────────────────────────────────────────────────
  Prepare:
    name: Install Dependencies
    concurrency:
      group: prepare-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Setup pnpm, node, and install
        uses: Anupheaus/ci-templates/.github/actions/pnpm-setup@v1
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          node-auth-token: ${{ secrets.GITHUB_TOKEN }}
          install-args: '--no-frozen-lockfile'

  # ── VALIDATE (parallel) ─────────────────────────────────────────────────────
  Validate-TypeCheck:
    name: Type check
    concurrency:
      group: validate-typecheck-${{ github.ref }}
      cancel-in-progress: true
    needs: Prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Setup pnpm, node, and install
        uses: Anupheaus/ci-templates/.github/actions/pnpm-setup@v1
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          node-auth-token: ${{ secrets.GITHUB_TOKEN }}
          install-args: '--no-frozen-lockfile'
      - name: Type check
        run: pnpm run typecheck

  Validate-Lint:
    name: Lint
    concurrency:
      group: validate-lint-${{ github.ref }}
      cancel-in-progress: true
    needs: Prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Setup pnpm, node, and install
        uses: Anupheaus/ci-templates/.github/actions/pnpm-setup@v1
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          node-auth-token: ${{ secrets.GITHUB_TOKEN }}
          install-args: '--no-frozen-lockfile'
      - name: Lint
        run: pnpm run lint

  Validate-Audit:
    name: Security audit
    concurrency:
      group: validate-audit-${{ github.ref }}
      cancel-in-progress: true
    needs: Prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Setup pnpm, node, and install
        uses: Anupheaus/ci-templates/.github/actions/pnpm-setup@v1
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          node-auth-token: ${{ secrets.GITHUB_TOKEN }}
          install-args: '--no-frozen-lockfile'
      - name: Security audit
        run: pnpm audit --audit-level=critical

  # ── TEST (parallel) ─────────────────────────────────────────────────────────
  Test-Vitest:
    name: Vitest Tests
    concurrency:
      group: test-vitest-${{ github.ref }}
      cancel-in-progress: true
    needs: Prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Setup pnpm, node, and install
        uses: Anupheaus/ci-templates/.github/actions/pnpm-setup@v1
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          node-auth-token: ${{ secrets.GITHUB_TOKEN }}
          install-args: '--no-frozen-lockfile'

      - name: Run Vitest tests
        run: pnpm run test:ci

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/vitest/lcov.info
          fail_ci_if_error: false

  Test-Storybook:
    name: Storybook Tests
    concurrency:
      group: test-storybook-${{ github.ref }}
      cancel-in-progress: true
    needs: Prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
    permissions:
      contents: read
      packages: read
    steps:
      - name: Setup pnpm, node, and install
        uses: Anupheaus/ci-templates/.github/actions/pnpm-setup@v1
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          node-auth-token: ${{ secrets.GITHUB_TOKEN }}
          install-args: '--no-frozen-lockfile'

      - name: Run Storybook tests
        env:
          STORYBOOK_COVERAGE: 1
        run: pnpm run storybook:build --quiet && npx concurrently -k -s first -n "SB,TEST" -c "magenta,blue" "npx http-server storybook-static --port 6006 --silent" "npx wait-on tcp:127.0.0.1:6006 && test-storybook --ci --coverage"

      - name: Upload Storybook coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/storybook/lcov.info
          fail_ci_if_error: false

  # ── PUBLISH — master only, after Validate and Test ──────────────────────────
  Publish:
    name: Build and Publish
    concurrency:
      group: publish-${{ github.ref }}
      cancel-in-progress: false
    needs: [Validate-TypeCheck, Validate-Lint, Validate-Audit, Test-Vitest, Test-Storybook]
    if: github.ref == 'refs/heads/master' && github.repository_owner == 'Anupheaus'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Setup pnpm, node, and install
        uses: Anupheaus/ci-templates/.github/actions/pnpm-setup@v1
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          node-auth-token: ${{ secrets.GITHUB_TOKEN }}
          install-args: '--no-frozen-lockfile'
          fetch-depth: '0'

      - name: Build
        run: pnpm run build

      - name: Bump version
        uses: phips28/gh-action-bump-version@master
        with:
          version-type: patch
          commit-message: 'CI: bumps version to {{version}} [skip ci]'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Pack
        run: pnpm pack

      - name: Publish
        run: pnpm publish $(ls *.tgz) --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
